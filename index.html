<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<title>Site Logon</title>
</head>
<body>

<!-- ------------------------------------------------------------- first run -->
<div id="view-login" class="view" hidden>
  <div class="brand">
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <h1>Site Logon</h1>
    <p class="sub">Sign in once. This phone will stay signed in.</p>
  </div>
  <form id="login-form" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username"
           inputmode="email" autocapitalize="off" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button class="primary" id="login-go" type="submit">Sign in</button>
  </form>
  <div id="login-msg"></div>
</div>

<!-- ----------------------------------------------------------------- main -->
<div id="view-main" class="view" hidden>
  <header>
    <div>
      <strong id="hdr-name"></strong>
      <span id="hdr-company"></span>
    </div>
    <button id="menu-btn" class="icon" aria-label="Menu">&#9776;</button>
  </header>

  <div id="net" class="banner" hidden></div>

  <form id="logon-form">
    <label for="work-date">Date</label>
    <input id="work-date" type="date" required>

    <fieldset>
      <legend>Who is on site</legend>
      <div id="people" class="people"></div>
      <button type="button" class="link" id="add-other">+ Someone not on the list</button>
    </fieldset>

    <label for="voltage">Voltage</label>
    <select id="voltage"></select>

    <label for="cmr">CMR</label>
    <select id="cmr" disabled></select>
    <p class="hint" id="cmr-hint"></p>

    <label for="fl">Functional location</label>
    <input id="fl" type="search" autocapitalize="characters" autocomplete="off"
           spellcheck="false" placeholder="Start typing to narrow the list" disabled>
    <div id="fl-matches" class="matches" hidden></div>
    <p class="hint" id="fl-hint"></p>

    <label for="area">Area</label>
    <input id="area" readonly placeholder="Fills in from the functional location">

    <label for="work-type">Work type</label>
    <select id="work-type"></select>

    <label for="notes">Anything else</label>
    <textarea id="notes" rows="3" placeholder="Optional"></textarea>

    <button class="primary" id="send" type="submit">Send logon</button>
  </form>

  <div id="outbox" class="outbox" hidden></div>

  <section id="recent">
    <h2>Recent logons from this phone</h2>
    <ul id="recent-list"></ul>
  </section>

  <footer>
    <button class="link" id="refresh">Refresh lists</button>
    <button class="link danger" id="signout">Sign out</button>
    <span class="ver" id="ver"></span>
  </footer>
</div>

<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
